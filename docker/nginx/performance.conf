# Exposes perf_tool at /performance, proxied to the `perftool` container.
# Dropped into /etc/nginx/sites-enabled/ (bind-mounted over the named volume
# that geonode.conf's own envsubst templating owns — this file lives
# alongside it, untouched by that templating, matching nginx's own
# `include sites-enabled/*.conf;` glob). See PERF_TOOL.md.

location /performance {
  return 301 /performance/;
}

# ^~ forces this prefix match to win outright, skipping nginx's regex
# locations entirely — geonode.conf has a `location ~* \.(?:...|css|js|...)$`
# nested under `location /` that would otherwise hijack every request under
# /performance/ ending in a static-asset extension (regex locations always
# beat prefix locations in nginx, regardless of specificity, unless told not
# to) and route it to django instead of perftool.
location ^~ /performance/ {
  # A *literal* proxy_pass target (e.g. "http://perftool:5001/") gets its
  # hostname resolved once, at nginx startup/config-load — if the perftool
  # container isn't up and resolvable yet at that moment, nginx refuses to
  # start at all (a full outage of this whole nginx, not just this route).
  # Confirmed live: "host not found in upstream 'perftool'" killed the
  # container on a cold `docker compose up`. A *variable* target defers DNS
  # resolution to request time instead — the same "start even if the
  # upstream isn't up yet" trick geonode.conf uses elsewhere — but a
  # variable target also disables nginx's automatic "strip the matched
  # location prefix" rewrite (a separate, earlier bug found here: every
  # request arrived at perftool as "/" regardless of path). Getting both
  # properties means doing the prefix strip explicitly instead of relying on
  # that automatic rewrite:
  # $upstream must be set BEFORE the rewrite below: `break` halts processing
  # of every remaining rewrite-module directive in this block, `set`
  # included — putting `set` after it meant $upstream was never assigned,
  # producing "invalid URL prefix in 'http://'" (confirmed live).
  set $upstream perftool:5001;
  rewrite ^/performance/(.*)$ /$1 break;
  proxy_pass http://$upstream;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # tells perf_tool's Flask app (via ProxyFix) to generate links/redirects
  # rooted at /performance instead of /
  proxy_set_header X-Forwarded-Prefix /performance;
  proxy_redirect off;
}
