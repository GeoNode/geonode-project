{% extends "geonode-mapstore-client/snippets/custom_theme.html" %}
{% comment %} MapAction brand: navy #18448D, red #E63B2E (logo files and maps.mapaction.org) {% endcomment %}
{% block content %}
<style>
    .msgapi, .msgapi .gn-theme, [data-ms2-container] {
        --gn-font-family-base: 'Montserrat', sans-serif;
        --gn-primary: #18448D;
        --gn-primary-contrast: #ffffff;
        --gn-link-color: #18448D;
        --gn-link-hover-color: #E63B2E;
        --gn-focus-color: rgba(230, 59, 46, 0.45);
        --gn-danger: #E63B2E;
        --gn-info: #18448D;
    }
    .msgapi .gn-menu.gn-primary, .msgapi .gn-primary { background-color: #18448D; }
    .msgapi .gn-menu.gn-menu-symmetric img { height: 40px; }
    /* red as the accent: active and hovered menu items, buttons on hover, the "View" call to action */
    .msgapi .gn-menu.gn-primary .gn-menu-list > li > a:hover,
    .msgapi .gn-menu.gn-primary .gn-menu-list > li > button:hover { box-shadow: inset 0 -4px 0 #E63B2E; background: transparent; }
    .msgapi .btn-primary { background-color: #18448D; border-color: #18448D; }
    .msgapi .btn-primary:hover, .msgapi .btn-primary:focus, .msgapi .btn-primary.active { background-color: #E63B2E; border-color: #E63B2E; }
    .msgapi .gn-resource-card:hover { box-shadow: 0 0 0 2px #E63B2E; }
    .msgapi .gn-details-info .nav-tabs > li.active > a,
    .msgapi .tabs-underline .nav-tabs > li.active > a { border-bottom-color: #E63B2E !important; }

    /* the red "Latest maps and data" bar, as on maps.mapaction.org */
    .ma-current { display: flex; align-items: stretch; background: #E63B2E; color: #fff; font-weight: 700;
                  text-transform: uppercase; letter-spacing: .02em; font-size: 14px; min-height: 40px; }
    .ma-current-title { background: #18448D; padding: 10px 28px 10px 16px; display: flex; align-items: center;
                        clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%); }
    .ma-current ul { list-style: none; margin: 0; padding: 0 0 0 14px; display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
    .ma-current a { color: #fff; text-decoration: none; }
    .ma-current a:hover { text-decoration: underline; color: #fff; }
    @media (max-width: 600px) { .ma-current { font-size: 12px; } .ma-current-title { padding-right: 22px; } }

    /* banner: as on the hosted site (left-aligned, smaller heading) */
    .msgapi #gn-hero .jumbotron .gn-hero-description { text-align: left; max-width: 1100px; margin: 0 auto; }
    .msgapi #gn-hero .jumbotron .gn-hero-description h1 { font-size: 52px; font-weight: 400; line-height: 1.15; }
    .msgapi #gn-hero .jumbotron .gn-hero-description p { font-size: 18px; margin-left: 0; }
    @media (max-width: 600px) { .msgapi #gn-hero .jumbotron .gn-hero-description h1 { font-size: 34px; } }

    /* MapAction's footer, as on maps.mapaction.org: in the page flow, after the content (GeoNode fixes it to the window) */
    .msgapi .gn-footer.ma-footer { position: relative; display: block; background: #18448D; color: #fff;
        padding: 44px 16px 36px; text-align: left; font-size: 15px; line-height: 1.55; z-index: 1; }
    .ma-footer-inner { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 40px; }
    .msgapi .gn-footer.ma-footer h4 { color: #fff; font-size: 17px; font-weight: 700; margin: 0 0 14px; }
    .msgapi .gn-footer.ma-footer p { margin: 0 0 12px; }
    .msgapi .gn-footer.ma-footer a { color: #fff !important; text-decoration: none; }
    .msgapi .gn-footer.ma-footer a:hover { color: #fff !important; box-shadow: inset 0 -2px 0 #E63B2E; }
    .msgapi .gn-footer.ma-footer ul.ma-footer-links { display: block; list-style: none; padding: 0; margin: 0;
        columns: 2; column-gap: 32px; }
    .msgapi .gn-footer.ma-footer ul.ma-footer-links li { font-size: 15px; text-align: left; min-width: 0; padding: 0;
        margin: 0 0 4px; break-inside: avoid; }
    .msgapi .gn-footer.ma-footer .ma-footer-btn { display: inline-block; background: #E63B2E; font-weight: 700;
        padding: 9px 30px; border-radius: 3px; margin: 2px 0 12px; }
    .msgapi .gn-footer.ma-footer .ma-footer-btn:hover { background: #fff; color: #E63B2E !important; box-shadow: none; }
    .ma-footer-fr { font-weight: 700; letter-spacing: .02em; text-transform: uppercase; font-size: 13px; }
    .ma-footer-small { font-size: 12px; opacity: .8; }
    @media (max-width: 760px) { .ma-footer-inner { grid-template-columns: 1fr; gap: 24px; } }
</style>
{% endblock %}
